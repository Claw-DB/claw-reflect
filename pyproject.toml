[project]
name = "claw-reflect"
version = "0.1.0"
requires-python = ">=3.11"
description = "Autonomous memory distillation engine for ClawDB"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Claw-DB Team" }]
keywords = ["ai", "agents", "memory", "distillation", "clawdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/Claw-DB/claw-reflect"
Repository = "https://github.com/Claw-DB/claw-reflect"
Issues = "https://github.com/Claw-DB/claw-reflect/issues"

[project.scripts]
claw-reflect = "claw_reflect.main:main"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "tenacity>=8.3",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "python-ulid>=2.2",
    "apscheduler>=3.10",
    "croniter>=2.0",
    "blake3>=1.0.4",
    "slowapi>=0.1.9",
    "limits>=3.13.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx",
    "factory-boy>=3.3",
    "Faker>=24",
    "aiosqlite>=0.20",
    "pip-audit>=2.7",
    "freezegun>=1.4",
    "respx>=0.21",
    "pytest-docker-compose>=3.2.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["claw_reflect*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=claw_reflect --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "claw_reflect/workers/tasks/*",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["claw_reflect.workers.tasks.*"]
disallow_untyped_decorators = false
