version: "3.9"

services:
  reflect-api:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - reflect-net

  reflect-worker:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: ["celery", "-A", "claw_reflect.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    networks:
      - reflect-net

  reflect-beat:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: ["celery", "-A", "claw_reflect.workers.celery_app", "beat", "--loglevel=info"]
    networks:
      - reflect-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clawreflect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - reflect-net

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - reflect-net

volumes:
  pgdata:
  redisdata:

networks:
  reflect-net:
    driver: bridge
