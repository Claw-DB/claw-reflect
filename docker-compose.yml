version: "3.9"

services:
  reflect-api:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - reflect-net
    mem_limit: 512m
    cpus: "1.0"

  reflect-worker:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: ["celery", "-A", "claw_reflect.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    networks:
      - reflect-net
    mem_limit: 1g
    cpus: "2.0"

  reflect-beat:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: ["celery", "-A", "claw_reflect.workers.celery_app", "beat", "--loglevel=info"]
    networks:
      - reflect-net
    mem_limit: 256m
    cpus: "0.5"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - reflect-net
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - reflect-net
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:

networks:
  reflect-net:
    driver: bridge
