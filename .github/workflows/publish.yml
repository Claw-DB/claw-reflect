name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t ghcr.io/claw-db/claw-reflect:${{ steps.vars.outputs.tag }} .
      - name: Push image
        run: docker push ghcr.io/claw-db/claw-reflect:${{ steps.vars.outputs.tag }}
      - name: Extract changelog section
        id: changelog
        run: |
          awk '/^## \[/{if (p) exit; p=1} p{print}' CHANGELOG.md > release-notes.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          body_path: release-notes.txt
