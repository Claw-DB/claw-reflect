[package]
name = "claw-reflect-client"
version = "0.1.0"
edition = "2021"
description = "Rust HTTP client for the claw-reflect service"
license = "Apache-2.0"
repository = "https://github.com/Claw-DB/claw-reflect"
readme = "README.md"
keywords = ["claw", "reflect", "client", "http", "ai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
wiremock = "0.6"
